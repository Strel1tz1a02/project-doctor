server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pool_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  pool:
    max-size: 12
    queue-capacity: 2
    queue-threads: 1
    borrow-timeout-ms: 3000
    hold-millis: 200

logging:
  level:
    com.example.slowquery.pool: debug
