server:
  port: 8080

spring:
  datasource:
    # 独立开发时默认 localhost/slow_query_demo/root/root；隔离环境由 Project Doctor
    # 注入 DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD 覆盖。
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:slow_query_demo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.slowquery.mapper: debug
